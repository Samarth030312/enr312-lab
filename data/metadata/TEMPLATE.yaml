# ============================================================================
# ENR312 hardware-run metadata: fields to add BY HAND to the sidecar the app writes
# (data/metadata/<subsystem>/<run_id>.json). Rewritten 2026-10-09 for ENR312.
# A raw file without these is not evidence: it cannot be traced to the set-up.
# ============================================================================

run_id: ""                        # as written by the app, e.g. TEMP-02-HW-20261012-101500
subsystem: ""                     # temperature | water_level | dc_motor
experiment_id: ""                 # TEMP-01..07 | LEVEL-01..07 | MOTOR-01..08
date: ""                          # YYYY-MM-DD
operator: ""
second_person: ""                 # REQUIRED for any run with mains (temperature)

firmware:
  fw_rev: ""                      # from $HELLO (git short hash, '-dirty' if uncommitted)
  build_flags: ""                 # e.g. -DLCD_I2C -DDHT_KIND=DHT11
  uploaded_with: "scripts/setup/upload"

hardware:
  board: "Arduino Uno"            # as read from the board
  wiring_doc: ""                  # docs/wiring/<SUBSYSTEM>_WIRING.md revision (git hash)
  wiring_photo: ""                # file name of the photo taken before power-up
  deviations_from_wiring_doc: ""
  supply_label: ""                # e.g. "12 V 5 A bench supply, current limit 3 A"
  components: ""                  # exact part numbers read from labels (sensor, relay, pump, motor, drive)

temperature:                      # temperature runs only
  sensor: ""                      # DHT22 | DHT11
  sensor_to_bulb_cm: null
  bulb_label: ""                  # e.g. "230 V 60 W"
  ssr_label: ""                   # full SSR label text; zero-cross or random?
  ambient_c: null

water_level:                      # level runs only
  tank_inner_mm: ""               # L x W x H
  sensor_to_floor_cm: null        # sent with $CAL
  full_height_cm: null
  pump_label: ""
  pump_path: ""                   # relay | mosfet

dc_motor:                         # motor runs only
  drive_slave_id: null            # from $HELLO
  drive_lpr_before: null          # firmware '# drive LPR was ...' line
  direction_check: ""             # "forward -> counts increase" or swapped (C-M3)
  load_on_shaft: ""

outcome:
  completed: null
  stop_reason: ""                 # normal | STOP | E-STOP | watchdog | guard | fault
  anomalies: ""
  video_file: ""

execution_status: NOT_EXECUTED    # NOT_EXECUTED | EXECUTED | VALIDATED | FAILED
data_class: HARDWARE
