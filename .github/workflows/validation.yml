name: validation
on: [push, pull_request]
jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validation/check_repo.py
  # The MATLAB test suite (matlab/tests) needs a MATLAB + Simulink licence and is run locally:
  #   matlab -batch "cd matlab/tests; results = runtests; assertSuccess(results)"
